name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build plugin ZIP
        run: |
          zip -r occi-parish-register-${{ steps.version.outputs.VERSION }}.zip \
            occi-parish-register.php readme.txt admin assets includes \
            --exclude "*.DS_Store" --exclude "*.git*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OCCI Parish Register v${{ steps.version.outputs.VERSION }}"
          body_path: ${{ github.workspace }}/readme.txt
          files: occi-parish-register-${{ steps.version.outputs.VERSION }}.zip
