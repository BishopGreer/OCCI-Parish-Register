name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build plugin ZIP
        run: |
          # Stage files inside a folder named exactly occi-parish-register/
          # so WordPress recognises the ZIP as an update to the existing plugin.
          mkdir -p /tmp/build/occi-parish-register
          cp -r occi-parish-register.php readme.txt admin assets includes public \
            /tmp/build/occi-parish-register/
          cd /tmp/build
          zip -r $GITHUB_WORKSPACE/occi-parish-register-${{ steps.version.outputs.VERSION }}.zip \
            occi-parish-register \
            --exclude "*.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OCCI Parish Register v${{ steps.version.outputs.VERSION }}"
          body_path: ${{ github.workspace }}/readme.txt
          files: occi-parish-register-${{ steps.version.outputs.VERSION }}.zip
